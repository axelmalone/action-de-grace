<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>action de grâce</title>
<meta property="og:title" content="action de grâce">
<meta property="og:description" content="a claude-inspired poster, as promised.">
<meta property="og:image" content="https://axelmalone.github.io/action-de-grace/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://axelmalone.github.io/action-de-grace/">
<meta property="og:type" content="video.other">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
  main{position:fixed;inset:0;display:grid;place-items:center}
  video{width:100%;height:100%;object-fit:contain;background:#000}
  #tap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:max(13vh,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,0) 45%);border:0;color:#fff;cursor:pointer;font:inherit}
  #tap span{display:flex;flex-direction:column;align-items:center;gap:16px;font-size:15px;letter-spacing:.06em;opacity:.92}
  #tap i{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center}
  #tap i:after{content:"";margin-left:6px;border-left:24px solid #fff;border-top:15px solid transparent;border-bottom:15px solid transparent}
  #tap[hidden]{display:none}
</style>
</head>
<body>
<main>
  <video id="v" src="film.mp4" poster="poster.jpg" playsinline preload="auto"></video>
  <button id="tap" aria-label="Play with sound"><span><i></i>tap to play · sound on</span></button>
</main>
<script>
  const v = document.getElementById('v'), tap = document.getElementById('tap');
  tap.onclick = () => { v.currentTime = 0; v.muted = false; v.play(); tap.hidden = true; };
  v.onclick = () => (v.paused ? v.play() : v.pause());
  v.onended = () => { tap.querySelector('span').lastChild.textContent = 'watch again'; tap.hidden = false; };
</script>
</body>
</html>
